<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 在样式和 React 加载前应用主题，减少首次加载时的颜色闪烁。
      (() => {
        let preference = 'system'
        try {
          const saved = localStorage.getItem('saguadlib-theme')
          if (['system', 'light', 'dark'].includes(saved)) preference = saved
        } catch { /* 存储不可用时跟随系统。 */ }
        const dark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false
        document.documentElement.dataset.theme = preference === 'system' ? (dark ? 'dark' : 'light') : preference
        document.documentElement.dataset.themePreference = preference
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaguaNoodle · 吉他练习与扒谱</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
